name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        # Označení verze se vypíše v aplikaci, aby šlo poznat, jestli
        # prohlížeč nedrží starou verzi z mezipaměti.
        run: |
          flutter build web --release \
            --base-href "/BOZP-app-ekodav-safety/" \
            --dart-define=BUILD_STAMP="$(TZ=Europe/Prague date '+%-d.%-m. %H:%M') (${GITHUB_SHA::7})"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web